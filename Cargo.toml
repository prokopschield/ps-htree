[package]
name = "ps-htree"
version = "0.1.0-0"
edition = "2024"
description = "Content-addressable B-tree-like data structure"
repository = "https://github.com/prokopschield/ps-htree"
license = "GPL-3.0-or-later"

[dependencies]
bytes = "1.11.1"
postcard = { version = "1.1.3", features = ["alloc"], optional = true }
ps-hash = "0.1.0-24"
ps-hkey = "0.1.0-34"
ps-rwt = "0.1.0-2"
ps-util = "0.1.0-7"
ps-uuid = "0.1.0-4"
rkyv = { version = "0.8", optional = true }
serde = { version = "1.0", optional = true }
thiserror = "2.0.18"

[dev-dependencies]
ps-datachunk = "0.1.0-36"

[features]
default = []
rkyv = ["dep:rkyv"]
serde = ["dep:postcard", "dep:serde", "ps-uuid/serde"]

[lints.clippy]
expect_used = "warn"
nursery = { level = "warn", priority = -1 }
panic = "forbid"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "forbid"

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
